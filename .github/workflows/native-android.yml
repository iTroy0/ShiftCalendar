name: Native Android

on:
  push:
    branches:
      - native-grafik-sz
  pull_request:
    paths:
      - 'app/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - '.github/workflows/native-android.yml'

concurrency:
  group: native-grafik-sz-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Unit tests
        run: gradle testReleaseUnitTest --no-daemon

      - name: Build release APK
        run: gradle assembleRelease --no-daemon

      - name: Show APK size
        run: ls -lh app/build/outputs/apk/release/app-release.apk

      - name: Prepare artifact
        run: cp app/build/outputs/apk/release/app-release.apk Grafik-SZ-native-release.apk

      - uses: actions/upload-artifact@v4
        with:
          name: grafik-sz-native-apk
          path: Grafik-SZ-native-release.apk
          if-no-files-found: error
